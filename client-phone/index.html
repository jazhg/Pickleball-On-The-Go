<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102923" />
  <title>Pickleball — Controller</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="remote">
    <header class="topbar">
      <span class="brand">PICKLEBALL<span>ON THE GO</span></span>
      <span id="seat-badge" class="seat">CONNECTING</span>
    </header>
    <div class="connection" role="status"><span id="connection-dot" class="status-dot"></span><span id="connection-title">Connecting…</span></div>
    <section class="play-area" aria-label="Game controller">
      <div class="scoreboard" aria-label="Score"><div><span>YOU</span><strong id="your-score">0</strong></div><span class="score-divider">:</span><div><span>OPPONENT</span><strong id="their-score">0</strong></div></div>
      <div class="action-zone">
        <span class="eyebrow">YOUR PHONE. YOUR PADDLE.</span>
        <button id="synthetic-button" class="swing-button" type="button" disabled aria-label="Swing the paddle">
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="6" width="28" height="36" rx="12"/><path d="M28 42v15h8V42M24 16h16M24 23h16M24 30h16"/></svg>
          <strong>SWING</strong><span>Move your phone or tap</span>
        </button>
        <p id="ball-status" role="status">Waiting for the court…</p>
      </div>
      <button id="spawn-button" class="spawn-button" type="button" disabled><span aria-hidden="true">＋</span> New ball</button>
    </section>
    <section class="motion-controls" aria-label="Paddle controls">
      <button id="enable-button" class="enable-button" type="button">Enable motion <span aria-hidden="true">↗</span></button>
      <button id="recenter-button" class="recenter-button" type="button" disabled><span aria-hidden="true">◎</span> Recenter paddle</button>
      <p id="sensor-detail" role="status">Enable motion to use your phone as a paddle.</p>
      <p id="permission-error" class="error-text" role="alert" hidden></p>
    </section>
    <footer>KEEP YOUR EYES ON THE COURT</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
